<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣廟宇文化地圖｜Taiwan Temple Guide｜台湾寺院ガイド</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+JP:wght@400;700;900&display=swap');

:root {
  --gold:  #D4A017;
  --ink:   #1A0A00;
  --smoke: #F5EFE6;
  --ember: #E85D04;
  --dim:   rgba(26,10,0,0.55);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans TC', 'Noto Serif JP', sans-serif;
  background: var(--ink);
  color: var(--smoke);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 18px;
  background: linear-gradient(90deg,#1A0A00 60%,#2D1200);
  border-bottom: 2px solid var(--gold);
  z-index: 20;
  flex-shrink: 0;
  gap: 10px;
}
.logo {
  font-family: 'Noto Serif TC','Noto Serif JP',serif;
  font-weight: 900;
  font-size: 1.1rem;
  letter-spacing: .14em;
  color: var(--gold);
  text-shadow: 0 0 18px rgba(212,160,23,.5);
  white-space: nowrap;
}
.logo span { color: var(--ember); }
.header-right { display:flex; align-items:center; gap:10px; }

/* NAV TABS */
.nav-tabs { display:flex; gap:4px; }
.nav-btn {
  background: transparent;
  border: 1px solid rgba(212,160,23,.4);
  color: rgba(212,160,23,.7);
  font-family: inherit;
  font-size: .72rem;
  padding: 4px 10px;
  border-radius: 2px;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.nav-btn.active, .nav-btn:hover {
  background: var(--gold);
  color: var(--ink);
  border-color: var(--gold);
}

/* LANG */
.lang-toggle { display:flex; gap:4px; }
.lang-btn {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: inherit;
  font-size: .72rem;
  padding: 4px 8px;
  border-radius: 2px;
  cursor: pointer;
  transition: all .2s;
}
.lang-btn.active,.lang-btn:hover { background:var(--gold); color:var(--ink); }

/* MAIN */
.main { display:flex; flex:1; overflow:hidden; }

/* SIDEBAR */
.sidebar {
  width: 290px;
  flex-shrink: 0;
  background: linear-gradient(180deg,#1E0D02 0%,#120700 100%);
  border-right: 1px solid rgba(212,160,23,.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* PANEL switcher inside sidebar */
.panel { display:none; flex-direction:column; flex:1; overflow:hidden; }
.panel.active { display:flex; }

/* Rank panel */
.rank-header {
  padding: 13px 15px 9px;
  border-bottom: 1px solid rgba(212,160,23,.2);
  display: flex; align-items:center; gap:7px;
}
.rank-title {
  font-family:'Noto Serif TC','Noto Serif JP',serif;
  font-size: .88rem; font-weight:600; color:var(--gold); letter-spacing:.1em;
}
.rank-list { overflow-y:auto; flex:1; padding:6px 0; }
.rank-list::-webkit-scrollbar { width:4px; }
.rank-list::-webkit-scrollbar-thumb { background:rgba(212,160,23,.3); border-radius:2px; }
.rank-item {
  display:flex; align-items:center; gap:9px;
  padding:8px 14px; cursor:pointer;
  transition:background .15s;
  border-left:3px solid transparent;
}
.rank-item:hover { background:rgba(212,160,23,.08); border-left-color:var(--gold); }
.rank-item.active { background:rgba(212,160,23,.14); border-left-color:var(--ember); }
.rank-num { font-family:'Noto Serif TC',serif; font-size:.95rem; font-weight:900; width:22px; text-align:center; flex-shrink:0; }
.rank-num.top1{color:#FFD700;} .rank-num.top2{color:#C0C0C0;} .rank-num.top3{color:#CD7F32;} .rank-num.other{color:rgba(212,160,23,.5);font-size:.8rem;}
.rank-info { flex:1; min-width:0; }
.rank-name { font-size:.83rem; font-weight:500; color:var(--smoke); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-deity { font-size:.7rem; color:rgba(245,239,230,.5); margin-top:1px; }
.ibar-wrap { width:55px; flex-shrink:0; }
.ibar { height:4px; border-radius:3px; background:linear-gradient(90deg,var(--ember),var(--gold)); margin-bottom:2px; }
.iscore { font-size:.62rem; color:var(--gold); text-align:right; }

/* Calendar panel */
.cal-header {
  padding:13px 15px 9px;
  border-bottom:1px solid rgba(212,160,23,.2);
}
.cal-title {
  font-family:'Noto Serif TC','Noto Serif JP',serif;
  font-size:.88rem; font-weight:600; color:var(--gold); letter-spacing:.1em;
}
.cal-month-nav {
  display:flex; align-items:center; justify-content:space-between;
  margin-top:8px;
}
.cal-month-label { font-size:.82rem; color:var(--smoke); }
.cal-arrow {
  background:none; border:1px solid rgba(212,160,23,.35); color:var(--gold);
  width:22px; height:22px; border-radius:2px; cursor:pointer; font-size:.9rem;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.cal-arrow:hover { background:rgba(212,160,23,.15); }
.cal-list { overflow-y:auto; flex:1; padding:8px 0; }
.cal-list::-webkit-scrollbar { width:4px; }
.cal-list::-webkit-scrollbar-thumb { background:rgba(212,160,23,.3); border-radius:2px; }
.cal-item {
  padding:9px 14px;
  border-left:3px solid var(--ember);
  margin:4px 10px;
  background:rgba(212,160,23,.05);
  border-radius:0 3px 3px 0;
  cursor:pointer;
  transition:background .15s;
}
.cal-item:hover { background:rgba(212,160,23,.12); }
.cal-date { font-size:.68rem; color:var(--ember); letter-spacing:.06em; margin-bottom:2px; }
.cal-event-name { font-size:.82rem; color:var(--smoke); font-weight:500; }
.cal-temple-ref { font-size:.7rem; color:rgba(212,160,23,.65); margin-top:2px; }
.cal-empty { padding:20px 14px; font-size:.8rem; color:rgba(245,239,230,.35); text-align:center; }

/* Stamp panel */
.stamp-header {
  padding:13px 15px 9px;
  border-bottom:1px solid rgba(212,160,23,.2);
}
.stamp-title {
  font-family:'Noto Serif TC','Noto Serif JP',serif;
  font-size:.88rem; font-weight:600; color:var(--gold); letter-spacing:.1em;
}
.stamp-progress {
  font-size:.7rem; color:rgba(212,160,23,.6); margin-top:4px;
}
.stamp-prog-bar {
  height:3px; background:rgba(212,160,23,.15); border-radius:2px; margin-top:6px; overflow:hidden;
}
.stamp-prog-fill {
  height:100%; background:linear-gradient(90deg,var(--ember),var(--gold));
  border-radius:2px; transition:width .5s ease;
}
.stamp-grid {
  overflow-y:auto; flex:1; padding:10px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:7px;
}
.stamp-grid::-webkit-scrollbar { width:4px; }
.stamp-grid::-webkit-scrollbar-thumb { background:rgba(212,160,23,.3); border-radius:2px; }
.stamp-cell {
  aspect-ratio:1; border-radius:4px;
  border:1px solid rgba(212,160,23,.2);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:.58rem; color:rgba(245,239,230,.3); text-align:center; padding:3px;
  cursor:pointer; transition:all .2s; background:rgba(0,0,0,.2);
  position:relative; overflow:hidden;
}
.stamp-cell.collected {
  border-color:var(--gold); color:var(--gold);
  background:rgba(212,160,23,.1);
}
.stamp-cell .stamp-emoji { font-size:1.3rem; margin-bottom:2px; }
.stamp-cell .stamp-num {
  position:absolute; top:2px; right:4px;
  font-size:.55rem; color:rgba(212,160,23,.5);
}
.stamp-cell.collected .stamp-num { color:var(--ember); }
.stamp-cell:hover { border-color:rgba(212,160,23,.5); background:rgba(212,160,23,.06); }
.stamp-unlock-flash {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(26,10,0,.95); border:2px solid var(--gold);
  border-radius:8px; padding:28px 36px; text-align:center; z-index:100;
  display:none; animation:popIn .3s ease;
}
.stamp-unlock-flash.show { display:block; }
@keyframes popIn { from{transform:translate(-50%,-50%) scale(.7);opacity:0} to{transform:translate(-50%,-50%) scale(1);opacity:1} }
.flash-emoji { font-size:3rem; margin-bottom:8px; }
.flash-title { font-family:'Noto Serif TC',serif; font-size:1.1rem; color:var(--gold); margin-bottom:4px; }
.flash-sub { font-size:.78rem; color:rgba(245,239,230,.65); }

/* MAP AREA */
.map-area {
  flex:1; position:relative; overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#1a0800 0%,#0a0400 100%);
}
canvas { display:block; width:100%; height:100%; }

/* INFO CARD */
.info-card {
  position:absolute; top:16px; right:16px; width:272px;
  background:rgba(26,10,0,.93); border:1px solid var(--gold);
  border-radius:4px; backdrop-filter:blur(8px);
  padding:16px; display:none; z-index:5;
  animation:slideIn .2s ease;
  max-height:calc(100% - 32px); overflow-y:auto;
}
.info-card::-webkit-scrollbar { width:3px; }
.info-card::-webkit-scrollbar-thumb { background:rgba(212,160,23,.3); border-radius:2px; }
.info-card.visible { display:block; }
@keyframes slideIn { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:translateX(0)} }
.card-close {
  position:absolute; top:9px; right:11px;
  background:none; border:none; color:rgba(245,239,230,.4);
  font-size:1rem; cursor:pointer; line-height:1;
}
.card-close:hover { color:var(--smoke); }
.card-rank { font-size:.67rem; color:var(--ember); letter-spacing:.12em; margin-bottom:3px; }
.card-name { font-family:'Noto Serif TC','Noto Serif JP',serif; font-size:1.2rem; font-weight:900; color:var(--gold); line-height:1.3; margin-bottom:2px; }
.card-deity { font-size:.78rem; color:var(--ember); margin-bottom:8px; }
.card-divider { border:none; border-top:1px solid rgba(212,160,23,.2); margin:8px 0; }
.card-desc { font-size:.78rem; color:rgba(245,239,230,.75); line-height:1.7; margin-bottom:8px; }
.card-meta { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.meta-item { background:rgba(212,160,23,.07); border-radius:3px; padding:5px 7px; }
.meta-label { font-size:.62rem; color:rgba(212,160,23,.6); letter-spacing:.07em; margin-bottom:1px; }
.meta-value { font-size:.75rem; color:var(--smoke); }
.incense-full-bar { margin-top:9px; height:5px; background:rgba(212,160,23,.15); border-radius:3px; overflow:hidden; }
.incense-fill { height:100%; background:linear-gradient(90deg,var(--ember),var(--gold)); border-radius:3px; transition:width .5s ease; }
.incense-label { display:flex; justify-content:space-between; margin-top:3px; font-size:.62rem; color:rgba(212,160,23,.6); }

/* Card stamp section */
.card-stamp-section { margin-top:10px; padding-top:8px; border-top:1px solid rgba(212,160,23,.2); display:flex; align-items:center; gap:9px; }
.card-stamp-icon { font-size:1.5rem; }
.card-stamp-text { font-size:.75rem; color:rgba(245,239,230,.65); }
.card-stamp-btn {
  margin-top:4px; background:linear-gradient(90deg,#8B1A00,#C0392B);
  border:none; color:#fff; font-family:inherit; font-size:.72rem;
  padding:4px 10px; border-radius:2px; cursor:pointer; transition:opacity .2s;
}
.card-stamp-btn:hover { opacity:.85; }
.card-stamp-btn.collected { background:rgba(212,160,23,.2); color:var(--gold); cursor:default; }

/* HINT */
.map-hint {
  position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  font-size:.7rem; color:rgba(245,239,230,.3); letter-spacing:.08em;
  pointer-events:none; text-align:center;
}

/* PARTICLES */
#particles { position:absolute; inset:0; pointer-events:none; z-index:1; }
.particle {
  position:absolute; width:2px; height:2px; background:var(--gold);
  border-radius:50%; opacity:0; animation:float linear infinite;
}
@keyframes float {
  0%   { transform:translateY(0) translateX(0); opacity:0; }
  10%  { opacity:.6; }
  90%  { opacity:.3; }
  100% { transform:translateY(-110px) translateX(var(--dx)); opacity:0; }
}
</style>
</head>

</header>

<div class="main">
  <aside class="sidebar">

    <!-- RANK PANEL -->
    <div class="panel active" id="panelRank">

      </div>
      <div class="rank-list" id="rankList"></div>
    </div>

    <!-- CALENDAR PANEL -->
    <div class="panel" id="panelCal">
      <div class="cal-header">
        <div class="cal-title" data-zh="廟會節慶行事曆" data-en="Festival Calendar" data-ja="祭りカレンダー">廟會節慶行事曆</div>
        <div class="cal-month-nav">
          <button class="cal-arrow" onclick="calPrev()">‹</button>

    </div>

    <!-- STAMP PANEL -->
    <div class="panel" id="panelStamp">
      <div class="stamp-header">
        <div class="stamp-title" data-zh="廟宇集章" data-en="Temple Stamps" data-ja="寺院スタンプ">廟宇集章</div>
        <div class="stamp-progress" id="stampProgress"></div>
        <div class="stamp-prog-bar"><div class="stamp-prog-fill" id="stampProgFill"></div></div>
      </div>
      <div class="stamp-grid" id="stampGrid"></div>
    </div>

  </aside>

  <!-- MAP -->
  <div class="map-area">

    <canvas id="mapCanvas"></canvas>

    <div class="info-card" id="infoCard">

      <div class="card-deity" id="cardDeity"></div>

      <div class="card-meta" id="cardMeta"></div>
      <div class="incense-full-bar"><div class="incense-fill" id="incenseFill"></div></div>
      <div class="incense-label">
        <span data-zh="香火指數" data-en="Incense Index" data-ja="香火指数">香火指數</span>
        <span id="incenseScore"></span>
      </div>
      <div class="card-stamp-section" id="cardStampSection">
        <div class="card-stamp-icon" id="cardStampIcon"></div>
        <div>
          <div class="card-stamp-text" id="cardStampText"></div>
          <button class="card-stamp-btn" id="cardStampBtn" onclick="collectStamp()"></button>
        </div>
      </div>
    </div>

    <div class="map-hint" data-zh="拖曳旋轉 · 滾輪縮放 · 點選廟宇" data-en="Drag to rotate · Scroll to zoom · Click temples" data-ja="ドラッグで回転 · スクロールでズーム · 寺院をクリック">
      拖曳旋轉 · 滾輪縮放 · 點選廟宇
    </div>
  </div>
</div>

<!-- STAMP UNLOCK FLASH -->
<div class="stamp-unlock-flash" id="stampFlash">
  <div class="flash-emoji" id="flashEmoji"></div>
  <div class="flash-title" id="flashTitle"></div>
  <div class="flash-sub" id="flashSub"></div>
</div>

let lang = 'zh';

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === ({zh:'繁中',en:'EN',ja:'日本語'}[l]));
  });
  document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = el.getAttribute('data-'+l); });
  buildRankList();
  buildCalendar();
  buildStampGrid();
  if (activeTemple) showCard(activeTemple);
}

function switchPanel(id, btn) {

// Controls
let isDragging=false,prevMouse={x:0,y:0};
let theta=0,phi=0.6,radius=5;
const camTarget=new THREE.Vector3(0,0,0);

function updateCamera(){
  camera.position.x=camTarget.x+radius*Math.sin(phi)*Math.sin(theta);
  camera.position.y=camTarget.y+radius*Math.cos(phi);
  camera.position.z=camTarget.z+radius*Math.sin(phi)*Math.cos(theta);
  camera.lookAt(camTarget);
}

canvas.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY};});
canvas.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  theta-=(e.clientX-prevMouse.x)*0.005;
  phi=Math.max(.2,Math.min(Math.PI/2.2,phi+(e.clientY-prevMouse.y)*0.005));
  prevMouse={x:e.clientX,y:e.clientY}; updateCamera();
});
window.addEventListener('mouseup',()=>isDragging=false);
canvas.addEventListener('wheel',e=>{radius=Math.max(2.5,Math.min(9,radius+e.deltaY*.005));updateCamera();e.preventDefault();},{passive:false});

let lastTouch=null,touchDist2=null;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1)lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.touches.length===2)touchDist2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&lastTouch){
    theta-=(e.touches[0].clientX-lastTouch.x)*.007;
    phi=Math.max(.2,Math.min(Math.PI/2.2,phi+(e.touches[0].clientY-lastTouch.y)*.007));
    lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}; updateCamera();
  }
  if(e.touches.length===2&&touchDist2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    radius=Math.max(2.5,Math.min(9,radius*(touchDist2/d)));touchDist2=d;updateCamera();
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>{lastTouch=null;touchDist2=null;});

// Camera anim
let camAnim=null;
function animateCameraTo(worldPos){
  const st=theta,sp=phi,sr=radius;
  const et=Math.atan2(worldPos.x,worldPos.z)+0.3,ep=0.55,er=3.5;
  let t2=0;
  camAnim=()=>{
    t2=Math.min(1,t2+.03);
    const e=t2<.5?2*t2*t2:-1+(4-2*t2)*t2;
    theta=st+(et-st)*e; phi=sp+(ep-sp)*e; radius=sr+(er-sr)*e; updateCamera();
    if(t2>=1)camAnim=null;
  };
}

  const rect=canvas.getBoundingClientRect();
  mouse2.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse2.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse2,camera);
  const hits=raycaster.intersectObjects(templeObjs);
  if(hits.length>0)focusTemple(hits[0].object.userData);
});
canvas.addEventListener('mousemove',e=>{
  if(isDragging)return;
  const rect=canvas.getBoundingClientRect();
  mouse2.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse2.y=-((e.clientY-rect.top)/rect.height)*2+1;

// Animate
let clock=0;
function animate(){
  requestAnimationFrame(animate); clock+=.016;
  if(camAnim)camAnim();
  templeObjs.forEach(pin=>{
    const ring=pin.userData.ringMesh; if(!ring)return;
    const s=1+.4*Math.sin(clock*2+ring.userData.phase);
    ring.scale.setScalar(s);
    ring.material.opacity=.5-.3*Math.sin(clock*2+ring.userData.phase);
    const isActive=activeTemple&&pin.userData.id===activeTemple.id;
    pin.material.color.set(isActive?'#ffffff':pin.userData.color);
  });
  island.position.y=-0.06+Math.sin(clock*.5)*.003;
  edges.position.y=island.position.y;
  renderer.render(scene,camera);
}

    const urlWithToken2 = PROXY + '?action=api&url=' + encodeURIComponent(rawUrl2) + '&token=' + encodeURIComponent(tdxToken);
    const resp = await fetch(urlWithToken2);
    if (!resp.ok) throw new Error('Activity request failed: ' + resp.status);
    const data = await resp.json();

    if (data.length > 0) {
      // Add TDX live activities to calendar display
      window.tdxActivities = data;
      buildCalendar(); // rebuild with live data
      showStatus(`📅 即時廟會活動已更新（${data.length} 筆）`);
    }
  } catch(e) {
    console.warn('TDX activities error:', e);
  }
}

// 4. Enrich info card with TDX photo
const origShowCard = showCard;
window.showCard = function(t) {
  origShowCard(t);
  // Inject TDX photo if available
  const existing = document.getElementById('tdxPhotoArea');
  if (existing) existing.remove();
  if (t.tdxPhoto) {
    const photoDiv = document.createElement('div');
    photoDiv.id = 'tdxPhotoArea';
    photoDiv.style.cssText = 'margin-top:10px;border-radius:3px;overflow:hidden;border:1px solid rgba(212,160,23,.25);';
    photoDiv.innerHTML = `
      <img src="${t.tdxPhoto}" alt="${t.zh.name}"
        style="width:100%;height:110px;object-fit:cover;display:block;"
        onerror="this.parentElement.remove()">
      <div style="font-size:.6rem;color:rgba(212,160,23,.4);padding:3px 6px;">📸 圖片來源：TDX 觀光署</div>`;
    document.getElementById('infoCard').appendChild(photoDiv);
  }
  // Show TDX-enriched description if available
  if (t.zh.descTDX && lang === 'zh') {
    const desc = document.getElementById('cardDesc');
    if (desc) desc.title = t.zh.descTDX;
  }
};

// 5. Enrich calendar with TDX live activities
const origBuildCal = buildCalendar;
window.buildCalendar = function() {
  origBuildCal();
  if (!window.tdxActivities || !window.tdxActivities.length) return;
  const list = document.getElementById('calList');

  // Add a separator
  const sep = document.createElement('div');
  sep.style.cssText = 'padding:6px 14px;font-size:.65rem;color:var(--ember);letter-spacing:.08em;border-top:1px solid rgba(212,160,23,.15);margin-top:4px;';
  sep.textContent = { zh:'🔴 即時活動（TDX 觀光署）', en:'🔴 Live Events (TDX)', ja:'🔴 リアルタイムイベント（TDX）' }[lang] || '🔴 即時活動';
  list.appendChild(sep);

  window.tdxActivities.slice(0, 6).forEach(act => {
    const start = act.StartTime ? new Date(act.StartTime) : null;
    const dateStr = start ? `${start.getFullYear()}/${start.getMonth()+1}/${start.getDate()}` : '';
    const div = document.createElement('div');
    div.className = 'cal-item';
    div.style.borderLeftColor = '#E85D04';
    div.innerHTML = `
      <div class="cal-date" style="color:#E85D04">${dateStr} ${act.City||''}</div>
      <div class="cal-event-name">${act.ActivityName||''}</div>
      <div class="cal-temple-ref">📍 ${act.Location||''}</div>`;
    list.appendChild(div);
  });
};

// Init TDX on load
(async () => {
  await getTDXToken();
  if (tdxToken) {
    await fetchTDXTemples();
    await fetchTDXActivities();
  }
})();
</script>
</body>
